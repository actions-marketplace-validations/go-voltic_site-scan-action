name: Go Voltic site scan
description: Scores a public page for structure, AI visibility, speed, accessibility and trust, in the job summary.
branding:
  icon: activity
  color: orange
inputs:
  url:
    description: The public page to scan, for example https://example.com.
    required: true
  fail-under:
    description: Fail the job if the score is below this number, 0 to 100. Leave empty to never fail on the score.
    required: false
outputs:
  score:
    description: The scan score, 0 to 100. Empty when the scan did not complete.
  report-url:
    description: A link to view and re-run this scan on go-voltic.com.
runs:
  using: node24
  main: dist/index.js
